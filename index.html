<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Férias">
    <meta name="description" content="Calculadora Profissional de Férias e Décimo Terceiro">
    <link rel="manifest" href="manifest.json">
    <title>🧮 Cálculo de Férias</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary: #10b981;
            --primary-dark: #047857;
            --primary-light: #ecfdf5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border: #e5e7eb;
            --success: #059669;
            --danger: #dc2626;
            --shadow-md: 0 8px 24px rgba(16, 185, 129, 0.08);
        }
        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 48px;
            display: flex;
            justify-content: center;
            font-size: 1.05rem;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 10px;
        }
        header h1 {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }
        header p {
            font-size: 1.05rem;
            color: var(--text-muted);
        }
        /* Toast Notification Customizado */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #1e293b;
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2000;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.mostrar {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .card h2 {
            font-size: 1.18rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .grupo {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1f2937;
        }
        input, select {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.1rem;
            background: #f9fafb;
            color: var(--text-main);
            transition: all 0.2s ease;
            appearance: none;
        }
        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 18px;
            padding-right: 44px;
        }
        input:focus, select:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .btn-calcular {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .btn-calcular:active {
            transform: scale(0.98);
        }

        /* Estilo da Janela Modal (Pop-up Centralizado) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.mostrar {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: var(--card);
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.mostrar .modal-content {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-size: 1.2rem;
            color: var(--primary-dark);
            font-weight: 700;
        }
        .btn-fechar-modal {
            background: #f3f4f6;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-fechar-modal:hover {
            background: #e5e7eb;
            color: var(--text-main);
        }

        .secao {
            margin-bottom: 20px;
        }
        .secao-titulo {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .linha {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 1.02rem;
        }
        .linha:last-child {
            border-bottom: none;
        }
        .linha.destaque {
            background: var(--primary-light);
            margin: 8px -10px;
            padding: 12px 10px;
            border-radius: 10px;
            border-bottom: none;
            font-weight: 700;
            color: var(--primary-dark);
            font-size: 1.08rem;
        }
        .linha.total {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-dark);
            padding-top: 14px;
            border-bottom: none;
            border-top: 2px solid var(--primary);
            margin-top: 8px;
        }
        .positivo { color: var(--success); font-weight: 600; }
        .negativo { color: var(--danger); font-weight: 600; }
        .divisor {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }
        .rodape {
            text-align: center;
            margin-top: 32px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🧮 Cálculo de Férias</h1>
        <p>Calculadora simples, rápida e completa</p>
    </header>

    <div class="toast" id="toast"></div>

    <div class="card">
        <h2>📝 Seus Dados</h2>
        
        <div class="grupo">
            <label for="salario">Salário mensal (R$)</label>
            <input type="number" id="salario" placeholder="Ex: 1500,00" step="0.01">
        </div>

        <div class="grupo">
            <label for="diasFerias">Dias de férias</label>
            <input type="number" id="diasFerias" placeholder="Ex: 30" value="30" min="1" max="30">
        </div>

        <div class="grupo">
            <label for="diasTrabalhados">Dias trabalhados no mês (saldo de salário)</label>
            <input type="number" id="diasTrabalhados" placeholder="Ex: 0" value="0" min="0" max="30">
        </div>

        <div class="grupo">
            <label for="promocoes">Promoções / Prêmios (R$) <span style="font-weight:normal; font-size:0.85rem; color:var(--text-muted);">(Livre de descontos)</span></label>
            <input type="number" id="promocoes" placeholder="Ex: 0,00" value="0" step="0.01">
        </div>

        <div class="grupo">
            <label for="decimo">💰 Décimo Terceiro — qual parcela calcular?</label>
            <select id="decimo">
                <option value="nenhum">Não calcular agora</option>
                <option value="primeira">✅ Somente a 1ª Parcela (50%)</option>
                <option value="segunda">💰 Somente a 2ª Parcela</option>
                <option value="ambos">📦 Calcular AMBAS as parcelas</option>
            </select>
        </div>

        <button class="btn-calcular" id="btnCalcular">Calcular Agora</button>
    </div>

    <!-- Janela Modal de Resultados -->
    <div class="modal-overlay" id="modalResultados">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 Resultado do Cálculo</h2>
                <button class="btn-fechar-modal" id="btnFecharModal">✕</button>
            </div>

            <div class="secao">
                <div class="secao-titulo">🏖️ Férias</div>
                <div id="resumoFerias"></div>
            </div>

            <div class="divisor" id="divisorDecimo" style="display: none;"></div>

            <div class="secao" id="secaoDecimo" style="display: none;">
                <div class="secao-titulo">💰 Décimo Terceiro</div>
                <div id="resumoDecimo"></div>
            </div>

            <div class="divisor" id="divisorTotal" style="display: none;"></div>

            <div class="secao" id="secaoTotalGeral" style="display: none;">
                <div id="totalGeral"></div>
            </div>
        </div>
    </div>

    <div class="rodape">
        Margem de erro para mais ou para menos R$ 50,00
                  Criado por Giliard Martins
    </div>
</div>

<script>
function mostrarToast(mensagem) {
    const toast = document.getElementById('toast');
    toast.textContent = mensagem;
    toast.classList.add('mostrar');
    setTimeout(() => {
        toast.classList.remove('mostrar');
    }, 3500);
}

// Tabela oficial progressiva do INSS
const TABELA_INSS = [
    { ate: 1302.00, aliquota: 0.075 },
    { ate: 2571.29, aliquota: 0.09 },
    { ate: 3856.94, aliquota: 0.12 },
    { ate: 7507.49, aliquota: 0.14 }
];

function formatarDinheiro(valor) {
    return 'R$ ' + valor.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function calcularINSS(valorBase) {
    let inss = 0;
    let faixaAnterior = 0;
    for (let i = 0; i < TABELA_INSS.length; i++) {
        const faixa = TABELA_INSS[i];
        if (valorBase <= faixa.ate) {
            inss += (valorBase - faixaAnterior) * faixa.aliquota;
            break;
        } else {
            inss += (faixa.ate - faixaAnterior) * faixa.aliquota;
            faixaAnterior = faixa.ate;
        }
    }
    const teto = TABELA_INSS[TABELA_INSS.length - 1].ate * TABELA_INSS[TABELA_INSS.length - 1].aliquota;
    return Math.min(inss, teto);
}

function calcularFerias(salario, dias, diasTrabalhados, promocoes) {
    const valorDia = salario / 30;
    const valorFerias = valorDia * dias;
    const umTerco = valorFerias / 3;
    const valorDiasTrabalhados = valorDia * diasTrabalhados;
    
    // Base sujeita ao INSS (Férias + 1/3 + Dias Trabalhados no Mês)
    const baseIncidência = valorFerias + umTerco + valorDiasTrabalhados;
    const inss = calcularINSS(baseIncidência);
    
    // Total bruto acumulado incluindo promoções
    const brutoTotal = baseIncidência + promocoes;
    const liquido = brutoTotal - inss;

    return {
        valorFerias: valorFerias,
        umTerco: umTerco,
        valorDiasTrabalhados: valorDiasTrabalhados,
        promocoes: promocoes,
        bruto: brutoTotal,
        inss: inss,
        liquido: liquido
    };
}

function calcularDecimo(salario, tipo) {
    if (tipo === 'nenhum') return null;
    const valorTotal = salario;
    const primeira = valorTotal / 2;
    const baseSegunda = valorTotal / 2;
    
    const inss = calcularINSS(baseSegunda);
    const segunda = baseSegunda - inss;
    
    let totalReceber = 0;
    if (tipo === 'primeira') totalReceber = primeira;
    else if (tipo === 'segunda') totalReceber = segunda;
    else totalReceber = primeira + segunda;

    return {
        valorTotal: valorTotal,
        primeira: primeira,
        segundaBruta: baseSegunda,
        inss: inss,
        segunda: segunda,
        totalReceber: totalReceber
    };
}

function renderLinha(texto, valor, classe) {
    if (!classe) classe = '';
    return '<div class="linha ' + classe + '"><span>' + texto + '</span><span>' + valor + '</span></div>';
}

const modal = document.getElementById('modalResultados');

document.getElementById('btnCalcular').addEventListener('click', function() {
    const salario = parseFloat(document.getElementById('salario').value.replace(',', '.'));
    const diasFerias = parseInt(document.getElementById('diasFerias').value) || 30;
    const diasTrabalhados = parseInt(document.getElementById('diasTrabalhados').value) || 0;
    const promocoes = parseFloat(document.getElementById('promocoes').value.replace(',', '.')) || 0;
    const tipoDecimo = document.getElementById('decimo').value;

    if (!salario || salario <= 0) {
        mostrarToast('✏️ Informe seu salário mensal para continuar.');
        document.getElementById('salario').focus();
        return;
    }

    const ferias = calcularFerias(salario, diasFerias, diasTrabalhados, promocoes);
    const decimo = calcularDecimo(salario, tipoDecimo);

    let htmlFerias = renderLinha('Salário base', formatarDinheiro(salario));
    htmlFerias += renderLinha(diasFerias + ' dias de férias', formatarDinheiro(ferias.valorFerias));
    htmlFerias += renderLinha('+ 1/3 Constitucional', formatarDinheiro(ferias.umTerco));
    
    if (diasTrabalhados > 0) {
        htmlFerias += renderLinha('+ ' + diasTrabalhados + ' dias trabalhados no mês', formatarDinheiro(ferias.valorDiasTrabalhados));
    }
    if (promocoes > 0) {
        htmlFerias += renderLinha('+ Promoções / Prêmios', formatarDinheiro(ferias.promocoes), 'positivo');
    }

    htmlFerias += renderLinha('Subtotal Bruto', formatarDinheiro(ferias.bruto));
    htmlFerias += '<div style="margin:4px 0;"></div>';
    htmlFerias += renderLinha('(-) INSS (Sobre férias e dias trabalhados)', formatarDinheiro(ferias.inss), 'negativo');
    htmlFerias += renderLinha('✅ FÉRIAS — Valor Líquido', formatarDinheiro(ferias.liquido), 'destaque');
    document.getElementById('resumoFerias').innerHTML = htmlFerias;

    const secaoDecimo = document.getElementById('secaoDecimo');
    const divisorDecimo = document.getElementById('divisorDecimo');
    const divisorTotal = document.getElementById('divisorTotal');
    const secaoTotalGeral = document.getElementById('secaoTotalGeral');

    if (decimo) {
        secaoDecimo.style.display = 'block';
        divisorDecimo.style.display = 'block';
        divisorTotal.style.display = 'block';
        secaoTotalGeral.style.display = 'block';

        let htmlDecimo = '';
        if (tipoDecimo === 'primeira' || tipoDecimo === 'ambos') {
            htmlDecimo += renderLinha('✅ 1ª Parcela (Integral 50%)', formatarDinheiro(decimo.primeira), 'positivo');
        }
        if (tipoDecimo === 'segunda' || tipoDecimo === 'ambos') {
            if (tipoDecimo === 'ambos') htmlDecimo += '<div style="margin:6px 0; color:var(--text-muted);">—</div>';
            htmlDecimo += renderLinha('2ª Parcela — Bruto', formatarDinheiro(decimo.segundaBruta));
            htmlDecimo += renderLinha('(-) INSS (Previdência)', formatarDinheiro(decimo.inss), 'negativo');
            htmlDecimo += renderLinha('✅ 2ª Parcela — Valor Líquido', formatarDinheiro(decimo.segunda), 'positivo');
        }
        if (tipoDecimo === 'ambos') {
            htmlDecimo += '<div style="margin:6px 0; color:var(--text-muted);">—</div>';
            htmlDecimo += renderLinha('💰 Total 13º Salário', formatarDinheiro(decimo.totalReceber), 'destaque');
        }
        document.getElementById('resumoDecimo').innerHTML = htmlDecimo;

        const totalGeral = ferias.liquido + decimo.totalReceber;
        document.getElementById('totalGeral').innerHTML = renderLinha('💵 VALOR TOTAL A RECEBER', formatarDinheiro(totalGeral), 'total');
    } else {
        secaoDecimo.style.display = 'none';
        divisorDecimo.style.display = 'none';
        divisorTotal.style.display = 'none';
        secaoTotalGeral.style.display = 'none';
    }

    // Exibe o modal centralizado sem rolar a página
    modal.classList.add('mostrar');
});

// Fechar modal pelo botão X
document.getElementById('btnFecharModal').addEventListener('click', function() {
    modal.classList.remove('mostrar');
});

// Fechar modal clicando fora da caixinha
modal.addEventListener('click', function(e) {
    if (e.target === modal) {
        modal.classList.remove('mostrar');
    }
});
</script>
</body>
</html>
